[package]
name = "biztel-vision-core"
version = "0.1.0"
edition = "2021"

[dependencies]
biztel-contracts = { path = "packages/contracts/bindings/rust" }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
[[bin]]
name = "core"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3







