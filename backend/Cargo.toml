[package]
name = "biztel-vision-core"
version = "0.1.0"
edition = "2021"

[dependencies]
biztel-contracts = { path = "packages/contracts/bindings/rust" }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.135"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
vercel_runtime = { version = "=1.1.2", optional = true }

[features]
default = []
vercel = ["dep:tokio", "dep:vercel_runtime"]
[[bin]]
name = "core"
path = "src/main.rs"

[[bin]]
name = "api"
path = "api/[...path].rs"
required-features = ["vercel"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3




